<body>

    <header>
        <h1>香港即時格價搜尋平台</h1>
        <p style="color: var(--text-muted); font-size: 14px;">已連結 Supabase 雲端資料庫</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜尋商品名稱、商店名稱（如：兩餸飯、旺角）..." oninput="handleSearch()">
    </div>

    <div id="loading" class="loading">資料載入中，請稍候...</div>
    <div id="productList" class="product-list"></div>

    <script>
        // 1. 初始化 Supabase（請將引號內的字串替換為你自己的 Supabase 憑證）
        const SUPABASE_URL = 'https://rcqsjaurzehkoitblvli.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_8F5Kp487KzmnxgDJifgTtQ_2kqLcj2n';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let storeDatabase = [];

        // 2. 從 Supabase 雲端資料庫抓取資料
        async function fetchProductsFromCloud() {
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*');

                if (error) throw error;

                // 將 Supabase 平坦欄位映射為 JS 物件格式
                storeDatabase = data.map(item => ({
                    id: item.id,
                    name: { zh: item.name_zh, en: item.name_en },
                    weight: { zh: item.weight_zh, en: item.weight_en },
                    price: item.price,
                    originalPrice: item.original_price,
                    bulkDiscount: item.min_bulk_qty ? {
                        minQty: item.min_bulk_qty,
                        bulkPrice: item.bulk_price
                    } : null,
                    store: { zh: item.store_zh, en: item.store_en },
                    address: { zh: item.address_zh, en: item.address_en },
                    url: item.url,
                    isFlashSale: item.is_flash_sale
                }));

                document.getElementById('loading').style.display = 'none';
                renderProducts(storeDatabase);
            } catch (err) {
                console.error("雲端資料載入失敗：", err.message);
                document.getElementById('loading').innerText = "資料載入失敗，請檢查 Supabase 連線設定。";
            }
        }

        // 3. 多件優惠計算邏輯
        function calculatePrice(product, quantity) {
            const qty = Math.max(1, parseInt(quantity) || 1);
            const bulk = product.bulkDiscount;

            if (bulk && qty >= bulk.minQty) {
                const total = qty * bulk.bulkPrice;
                return {
                    totalPrice: total,
                    unitPrice: bulk.bulkPrice,
                    isDiscounted: true
                };
            }

            return {
                totalPrice: qty * product.price,
                unitPrice: product.price,
                isDiscounted: false
            };
        }

        // 4. 動態更新試算結果
        function updateCalc(productId) {
            const product = storeDatabase.find(p => p.id === productId);
            const qtyInput = document.getElementById(`qty-${productId}`);
            const resultDisplay = document.getElementById(`res-${productId}`);

            if (!product || !qtyInput || !resultDisplay) return;

            const res = calculatePrice(product, qtyInput.value);
            resultDisplay.innerHTML = `總計: <strong>$${res.totalPrice}</strong> (平均單價 $${res.unitPrice})`;
        }

        // 5. 渲染商品卡片列表
        function renderProducts(products) {
            const container = document.getElementById('productList');
            
            if (products.length === 0) {
                container.innerHTML = `<div class="empty-state">沒有找到相關商品</div>`;
                return;
            }

            container.innerHTML = products.map(product => {
                // 標籤判定
                let badges = '';
                if (product.isFlashSale) {
                    badges += `<span class="badge badge-flash">限時優惠</span>`;
                }
                if (product.bulkDiscount) {
                    badges += `<span class="badge badge-bulk">買 ${product.bulkDiscount.minQty} 件以上每件 $${product.bulkDiscount.bulkPrice}</span>`;
                }

                // 試算器區塊
                const calcBlock = product.bulkDiscount ? `
                    <div class="calculator-box">
                        <div>
                            購買數量: 
                            <input type="number" id="qty-${product.id}" class="calculator-input" value="1" min="1" oninput="updateCalc(${product.id})">
                        </div>
                        <div class="calc-result" id="res-${product.id}">
                            總計: $${product.price}
                        </div>
                    </div>
                ` : '';

                return `
                    <div class="product-card">
                        <div class="card-header">
                            <div>
                                <div class="product-title">${product.name.zh}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">${product.weight.zh}</div>
                            </div>
                            <div class="badge-container">${badges}</div>
                        </div>

                        <div class="price-section">
                            <span class="current-price">$${product.price}</span>
                            ${product.originalPrice ? `<span class="original-price">$${product.originalPrice}</span>` : ''}
                        </div>

                        ${calcBlock}

                        <div class="store-info">
                            <span>📍 ${product.store.zh} (${product.address.zh})</span>
                            <a href="${product.url}" target="_blank" class="store-link">地圖 ↗</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 6. 搜尋過濾功能
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = storeDatabase.filter(product => {
                const nameZh = product.name.zh.toLowerCase();
                const nameEn = product.name.en.toLowerCase();
                const storeZh = product.store.zh.toLowerCase();
                const addressZh = product.address.zh.toLowerCase();

                return nameZh.includes(query) || nameEn.includes(query) || storeZh.includes(query) || addressZh.includes(query);
            });

            renderProducts(filtered);
        }

        // 頁面初次載入執行
        fetchProductsFromCloud();
    </script>
</body>
</html>
