        // 💡 自動解析單位規格並計算每 100g/ml/件 的平均價格
        function parseUnitPrice(weightStr, price) {
            if (!weightStr || price <= 0) return { unitPrice: price, label: '' };

            const normalized = weightStr.toLowerCase().trim();

            // 匹配 kg (例: 1.5kg, 500克, 2kg) -> 換算為每 100g 價格
            let match = normalized.match(/([\d\.]+)\s*(kg|千克|公斤)/);
            if (match) {
                const grams = parseFloat(match[1]) * 1000;
                const unitPrice = (price / grams) * 100;
                return { unitPrice: parseFloat(unitPrice.toFixed(2)), label: '/100g' };
            }

            // 匹配 g / 克 (例: 500g, 250克) -> 換算為每 100g 價格
            match = normalized.match(/([\d\.]+)\s*(g|克|公克)/);
            if (match) {
                const grams = parseFloat(match[1]);
                const unitPrice = (price / grams) * 100;
                return { unitPrice: parseFloat(unitPrice.toFixed(2)), label: '/100g' };
            }

            // 匹配 L / 升 (例: 1.25l, 2升) -> 換算為每 100ml 價格
            match = normalized.match(/([\d\.]+)\s*(l|升|公升)/);
            if (match) {
                const ml = parseFloat(match[1]) * 1000;
                const unitPrice = (price / ml) * 100;
                return { unitPrice: parseFloat(unitPrice.toFixed(2)), label: '/100ml' };
            }

            // 匹配 ml / 毫升 (例: 330ml) -> 換算為每 100ml 價格
            match = normalized.match(/([\d\.]+)\s*(ml|毫升)/);
            if (match) {
                const ml = parseFloat(match[1]);
                const unitPrice = (price / ml) * 100;
                return { unitPrice: parseFloat(unitPrice.toFixed(2)), label: '/100ml' };
            }

            // 匹配 件/包/個/卷 (例: 3件, 10卷, 6包) -> 換算為每 1 件價格
            match = normalized.match(/([\d\.]+)\s*(包|件|個|卷|條|罐|支|pack|pcs|rolls)/);
            if (match) {
                const count = parseFloat(match[1]);
                const unitPrice = price / count;
                return { unitPrice: parseFloat(unitPrice.toFixed(2)), label: '/件' };
            }

            // 無法解析數量單位時，按原價計算
            return { unitPrice: price, label: '' };
        }

        function getGoogleMapUrl(store, address) {
            const query = [store, address].filter(Boolean).join(' ');
            if (!query) return null;
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        async function fetchProductsFromCloud() {
            const t = translations[currentLang];
            try {
                const { data, error } = await supabaseClient
                    .from('products')

                if (error) throw error;

                storeDatabase = data.map(item => {
                    const weightZh = item.weight_zh || '';
                    const calculated = parseUnitPrice(weightZh, item.price || 0);

                    return {
                        id: item.id,
                        name: { 
                            zh: item.name_zh || '', 
                            en: item.name_en || item.name_zh || '' 
                        },
                        weight: { 
                            zh: weightZh, 
                            en: item.weight_en || weightZh 
                        },
                        price: item.price || 0,
                        unitPrice: calculated.unitPrice,  // 自動計算出之單位均價
                        unitLabel: calculated.label,      // 單位標籤，如 /100g
                        originalPrice: item.original_price || null,
                        bulkDiscount: item.min_bulk_qty ? {
                            minQty: item.min_bulk_qty,
                            bulkPrice: item.bulk_price
                        } : null,
                        store: {

                            en: item.store_en || item.store_zh || '' 
                        },
                        address: { 
                            zh: item.address_zh || '', 
                            en: item.address_en || item.address_zh || '' 
                        },
                        url: item.url || '#',
                        isFlashSale: item.is_flash_sale || false
                    };
                });

                document.getElementById('loading').style.display = 'none';
                handleSearch();
            } catch (err) {
                console.error("Cloud data load error:", err.message);
                document.getElementById('loading').innerText = t.loadError;
            }
        }

        function calculatePrice(product, quantity) {
            const qty = Math.max(1, parseInt(quantity) || 1);
            const bulk = product.bulkDiscount;

            if (bulk && qty >= bulk.minQty) {
                const total = qty * bulk.bulkPrice;
                return {
                    totalPrice: total.toFixed(1).replace(/\.0$/, ''),
                    unitPrice: bulk.bulkPrice,
                    isDiscounted: true
                };
            }

            const total = qty * product.price;
            return {
                totalPrice: total.toFixed(1).replace(/\.0$/, ''),
                unitPrice: product.price,
                isDiscounted: false
            };
        }

        function updateCalc(productId) {

            const product = storeDatabase.find(p => p.id === productId);

            if (!product || !qtyInput || !resultDisplay) return;

            const res = calculatePrice(product, qtyInput.value);
            resultDisplay.innerHTML = t.totalPrice(res.totalPrice, res.unitPrice);
        }

                            </div>

                        <div class="price-section">
                            <span class="current-price">$${product.price}</span>
                            ${product.unitLabel ? `<span class="unit-price-display">約 $${product.unitPrice}${product.unitLabel}</span>` : ''}
